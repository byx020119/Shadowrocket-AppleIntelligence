name: Daily update Johnshall + Apple Intelligence

on:
  schedule:
    # 11:52 Asia/Shanghai (test slot)
    - cron: "52 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch upstream rules
        run: python3 scripts/patch_johnshall.py

      - name: Publish as single Nightly commit on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sr_top500_whitelist_ad_appleintelligence.conf
          ROOT=$(git rev-list --max-parents=0 HEAD)
          git reset --soft "$ROOT"
          git commit --amend -m "Nightly build"
          git push --force origin HEAD:main
